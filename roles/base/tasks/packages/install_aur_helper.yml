---
- name: packages | AUR helper
  when: ansible_facts["os_family"] in ["Archlinux", "Artix Linux"]
  block:
    - name: packages | AUR helper | check if already installed
      ansible.builtin.stat:
        path: /usr/bin/{{ aur_helper_name }}
      register: helper_is_present

    - name: packages | AUR helper | clone repo (Archlinux)
      ansible.builtin.git:
        repo: https://aur.archlinux.org/{{ aur_helper_name }}-bin.git
        dest: /tmp/{{ aur_helper_name }}
      when: not helper_is_present.stat.exists

    - name: packages | AUR helper | install build dependencies
      become: true
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      when: not helper_is_present.stat.exists

    - name: packages | AUR helper | build package
      become_user: "{{ user }}"
      ansible.builtin.command: makepkg --noconfirm --skippgpcheck
      args:
        chdir: /tmp/{{ aur_helper_name }}
      when: not helper_is_present.stat.exists

    - name: packages | AUR helper | find built package
      ansible.builtin.find:
        paths: /tmp/{{ aur_helper_name }}
        patterns: "*.pkg.tar*"
      register: aur_helper_pkg
      when: not helper_is_present.stat.exists

    - name: packages | AUR helper | install built package
      become: true
      community.general.pacman:
        name: "{{ aur_helper_pkg.files[0].path }}"
        state: present
      when:
        - not helper_is_present.stat.exists
        - aur_helper_pkg.files | length > 0
